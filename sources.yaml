# ---------------------------------------------------------------------------
# Verosuodatus (koskee vain lahteita joissa tax_filter: true)
# ---------------------------------------------------------------------------
# Osumaa haetaan otsikosta JA asiasanoista. Vertailu tehdaan pienaakkosin
# ja ilman sanarajoja, koska suomen yhdyssanat vaativat sen: "lahdevero"
# ja "kiinteistovero" loytyvat vain osajonolla "vero".
#
# strong  -> merkitaan varmaksi vero-osumaksi
# maybe   -> merkitaan "tarkista"-merkinnalla mutta raportoidaan silti,
#            koska ohje sanoo raportoida matalalla kynnyksella
# exclude -> pudottaa osuman pois vaikka strong osuisi (vaarat ystavat)

filter:
  strong:
    - vero                  # kattaa: verotus, arvonlisävero, lähdevero, veronkorotus, jälkiverotus...
    - arvonlisä
    - ennakkoperin          # ennakkoperintä, ennakkoperinnässä
    - ennakonpidät          # ennakonpidätys
    - ennakonkanto
    - siirtohinnoitt        # siirtohinnoittelu
    - konserniavustu        # konserniavustus
    - vähennyskelpois       # vähennyskelpoisuus
    - sukupolvenvaihdo      # sukupolvenvaihdoshuojennus
    - luovutusvoit          # luovutusvoitto
    - elinkeinotul          # elinkeinotulon verottaminen
    - peitelty osin         # peitelty osinko
    - peitellyn osin
    - tonnisto              # tonnistoverotus
    - varainsiirto
    # "valmiste" yksinaan osui sanaan "valmistelu" (Helsingin HAO 7.7.2025
    # 4526/2025, aluevaaleja koskeva ratkaisu). Valmisteverotus sisaltaa
    # aina sanan "valmistevero", joten pidempi muoto riittaa.
    - valmistevero          # valmisteverotus, valmisteveron alainen
    - tulliselvit
    - verkkolasku           # harvinainen, mutta osuu ALV-velvoitteisiin

  maybe:
    - tulli                 # tullaus ja valmisteverotus kulkevat usein yhdessä
    - maksuunpano
    - huojennus
    - hankintameno
    - korkovähennys
    - korkojen vähentäm
    - yritysjärjestel
    - sulautumi
    - jakautumi
    - osakevaiht
    - liiketoimintasiirt
    - yleishyödyllis
    - arvostami
    - käypä arvo
    - osinko
    - pääomatul
    - ansiotul
    - palkkatul
    - luontoisetu
    - kustannusten korvaus
    - elinkeinotoimint
    # "maatalous" ja "metsatalous" yksinaan osuivat sosiaalietuus- ja
    # tukiratkaisuihin (lomituspalvelu, maataloustuen takaisinperinta).
    # Aito maa- tai metsatalouden veroratkaisu sisaltaa aina joko sanan
    # "vero" tai jonkin naista tarkemmista.
    - maatalouden tul
    - maatalouden vero
    - metsätalouden tul
    - metsävähenny
    - apuyhti
    - väliyhteis
    - kiinteä toimipaik
    - yleinen ja rajoitettu verovelvollisuus
    - taloudellinen työnantaja
    - verotusyhtym

  # Kumoaa vain heikon (maybe) osuman, ei vahvaa. Lisaa tanne sana, kun
  # sama vaara positiivinen toistuu.
  exclude:
    - liikennevakuutus
    - potilasvahinko
    - rikosvahinko
    - lomituspalvelu
    - sijaisapu
    - maataloustu              # maataloustuki, ei verotusta
    - toimeentulotu
