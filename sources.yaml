# ---------------------------------------------------------------------------
# Veron case-seuranta: lahteet, suodatus ja sahkopostimalli
#
# Tata tiedostoa muokkaamalla saat sailytettya sivun toiminnan ilman
# Python-koodin koskemista. Koodi lukee vain tamant tiedoston avaimet.
# ---------------------------------------------------------------------------

site:
  title: "Veron case-seuranta"
  subtitle: "Verohallinnon ohjeet ja päätökset, KVL, KHO ja hallinto-oikeudet"
  base_url: "https://lslander.github.io/Veron-case-seuranta/"
  timezone: "Europe/Helsinki"
  # Montako vuorokautta ratkaisuja pidetaan sivulla nakyvilla.
  archive_days: 120
  # Sahkopostimallin oletusikkuna (vuorokautta taaksepain).
  default_window_days: 1

email:
  subject_prefix: "Veron case -seuranta"
  greeting: "Huomenta,"
  signature: "Terv. Raul"
  distribution: "HKI TAX"
  # Kategoriat siina jarjestyksessa kuin ne halutaan viestiin.
  # "empty_label" on nimi, jota kaytetaan lauseessa "X:sta ei uusia ratkaisuja".
  order:
    - verohallinto
    - kvl
    - kho
    - hao

# ---------------------------------------------------------------------------
# Lahteet
# ---------------------------------------------------------------------------
# type:
#   vero_api       = vero.fi:n oma hakurajapinta /api/search/results
#   kho_rss        = kho.fi WordPress-syote (vuosikirjaratkaisut)
#   court_cards    = tuomioistuimet.fi / kho.fi korttilistat (div.content-lift)
#   finlex_hao     = finlex.fi:n hallinto-oikeuksien vuosisivu
#
# vero_api-lahteilla:
#   root_filter + type_id  = mika listaus haetaan (arvot vero.fi:n omista
#                            hakukomponenteista, ala muuta ilman syyta)
#   page_size              = montako uusinta luetaan joka ajossa
#
# tax_filter:
#   false = lahde on kokonaan vero-aiheinen, ei suodateta
#   true  = suodatetaan avainsanoilla (KHO ja HaO ratkaisevat kaikkia aloja)
#
# dedupe_group:
#   Kun sama ratkaisu voi tulla kahdesta lahteesta eri osoitteessa, anna
#   molemmille sama ryhmanimi. Kaksoiskappale tunnistetaan tuomioistuimen,
#   antopaivan ja otsikon numeron perusteella ja piilotetaan sivulta.
#   Ilman tata jokainen lahde pitaa omansa erillaan URL:n perusteella.
#
# seed_since:
#   Ensimmaisella ajolla (--seed) tata vanhemmat merkitaan jo raportoiduiksi.
#   Arvo on manuaalisen seurannan viimeisinta raportoitua ratkaisua seuraava
#   paiva. Tarkista ennen ensimmaista ajoa: jos ajat seedin vasta myohemmin,
#   nosta paivaykset vastaamaan silloista tilannetta, muuten valissa jo
#   kasin raportoidut ratkaisut tulevat viestiin toiseen kertaan.
#
#   HaO:n arvo on tahallaan vanhempi kuin muiden: hallinto-oikeuksien
#   ratkaisut ilmestyvat sivulle viiveella, joten 13.5.2026 jalkeen
#   annetut veroratkaisut ovat viela raportoimatta ja ne halutaan
#   ensimmaiseen viestiin.

sources:
  - id: vero-ohjeet
