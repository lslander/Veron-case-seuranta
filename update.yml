name: Veron case-seuranta

# Sivun pitaa olla tuore klo 9:10 Suomen aikaa. GitHubin cron on UTC:ssa
# eika tunne kesaaikaa, joten molemmat vuodenajat pitaa kattaa:
#   kesaaika  EEST = UTC+3  ->  06:xx UTC on 09:xx Suomessa
#   talviaika EET  = UTC+2  ->  07:xx UTC on 09:xx Suomessa
# GitHubin jaettu cron myohastyy ruuhkassa usein 5-20 minuuttia, ja tasatunnit
# ovat ruuhkaisimpia, joten ajo aloitetaan hyvissa ajoin ja toistetaan.
# Nama slotit antavat vahintaan kolme yritysta ennen 9:10 kumpanakin
# vuodenaikana. Ylimaarainen ajo ei haittaa: jos mikaan ei muuttunut,
# commit jaa tekematta.

on:
  schedule:
    - cron: "25,40,50 5 * * 1-5"   # 08:25 / 08:40 / 08:50 kesaaikaa
    - cron: "0,25,40,50 6 * * 1-5" # 09:00 kesaaikaa, 08:25-08:50 talviaikaa
    - cron: "0 7 * * 1-5"          # 09:00 talviaikaa
  workflow_dispatch:                # manuaalinen ajo Actions-valilehdelta
    inputs:
      seed:
        description: "Ensimmainen ajo: merkitse seed_since-arvoja vanhemmat jo raportoiduiksi"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: veroseuranta
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hae lahteet ja rakenna sivu
        run: |
          if [ "${{ inputs.seed }}" = "true" ]; then
            python main.py --seed
          else
            python main.py
          fi

      - name: Commitoi jos jotain muuttui
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state.json
          if git diff --staged --quiet; then
            echo "Ei muutoksia."
          else
            git commit -m "Seuranta $(TZ=Europe/Helsinki date '+%-d.%-m.%Y %H:%M')"
            git push
          fi
